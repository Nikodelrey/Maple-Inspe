<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maplewood TISH</title>
<link rel="apple-touch-icon" href="icon-maplewood.png">
<link rel="icon" type="image/png" href="icon-maplewood.png">
<meta name="apple-mobile-web-app-title" content="Maplewood">
<style>
:root{--teal:#3fd0d4;--navy:#1b2a8a;--ink:#1d2433;--bg:#eef3f6;--card:#fff;--line:#c9d3dc;--red:#c62828;--sel:#1b2a8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px}
/* ---------- app chrome ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:env(safe-area-inset-top) 0 0}
.top .bar{display:flex;align-items:center;gap:8px;padding:8px 10px}
.top .addr{flex:1;min-width:0;font-weight:600;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tb{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:14px}
.tabs{display:flex;overflow-x:auto;background:#d9e2ea;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;padding:10px 12px;color:var(--navy);font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--navy);background:#fff}
main{max-width:900px;margin:0 auto;padding:10px 10px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}
.sh{display:flex;align-items:center;gap:6px;background:var(--teal);color:#06205e;font-weight:700;padding:6px 10px;font-size:13.5px;letter-spacing:.2px}
.sh .t{flex:1}
.sh button{border:1px solid #0d6e74;background:#e9fbfc;color:var(--navy);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:7px 10px;border-top:1px solid #e3e9ee;align-items:center}
.it:first-of-type{border-top:0}
.it .il{grid-column:1/2;font-size:14.5px}
.it .il b{color:var(--navy);margin-right:3px}
.it .iv{grid-column:2/3;grid-row:1/3;min-width:62px;height:44px;border:1.5px solid var(--navy);border-radius:7px;background:#fff;font-style:italic;font-weight:600;color:#000;position:relative;padding:0 6px}
.it .iv .rc{position:absolute;top:-7px;right:-7px;background:var(--navy);color:#fff;border-radius:10px;font-size:11px;font-style:normal;min-width:18px;height:18px;line-height:18px;padding:0 4px}
.it .iv.need{border-color:var(--red);box-shadow:0 0 0 2px #f6c8c8}
.it .iv.need .rc{background:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.btns button{min-width:34px;height:36px;padding:0 4px;border:1px solid #9aa7b4;border-radius:6px;background:#f6f8fa;color:#222;font-weight:600;font-size:14px}
.btns button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.sub .il{padding-left:22px;color:#444}
.spec{padding:8px 10px;border-top:1px solid #e3e9ee;font-size:14px}
.spec .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:4px 0}
.spec .lab{font-weight:600;color:var(--navy);min-width:62px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #9aa7b4;border-radius:16px;padding:5px 10px;background:#f6f8fa}
.chip input{margin:0}
.chip.on{background:#dfe6ff;border-color:var(--sel)}
.spec input[type=text],.spec input:not([type]){width:90px;padding:5px 7px;border:1px solid #9aa7b4;border-radius:6px}
.note{font-size:12.5px;color:#4a5562;padding:6px 10px}
.fld{display:block;padding:6px 10px}
.fld>span{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 9px;border:1px solid #9aa7b4;border-radius:7px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.unitbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.unitbar b{color:var(--navy)}
.unitbar .ub{border:1px solid #9aa7b4;background:#f6f8fa;border-radius:7px;padding:6px 12px;font-weight:700}
.unitbar .ub.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.unitbar input{flex:1;min-width:120px;padding:6px 8px;border:1px solid #9aa7b4;border-radius:6px}
.pbtn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--navy);color:#fff;font-weight:600}
.pbtn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.pbtn.red{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.pager{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(238,243,246,.96);border-top:1px solid var(--line)}
.pager button{flex:1;max-width:200px}
.joblist .job{display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid #e3e9ee}
.joblist .job:first-child{border-top:0}
.joblist .job .jt{flex:1;min-width:0}
.joblist .job .jt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.joblist .job .jt small{color:#5a6673}
.joblist .job button{border:1px solid #9aa7b4;background:#f6f8fa;border-radius:7px;padding:6px 10px;font-size:13px}
.warn{background:#fff4e5;border:1px solid #f0c27a;border-radius:8px;padding:8px 10px;font-size:13.5px;margin-bottom:10px}
.warn b{color:#8a4b00}
/* modal */
.mod{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.45);display:none;align-items:flex-end;justify-content:center}
.mod.on{display:flex}
.mod .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
@media(min-width:700px){.mod{align-items:center}.mod .box{border-radius:14px}}
.mod h3{margin:2px 0 8px;font-size:16px;color:var(--navy)}
.rem{border:1px solid var(--line);border-radius:9px;padding:8px;margin:8px 0;background:#fafcfd}
.rem .rr{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.rem .rr button{min-width:36px;height:32px;border:1px solid #9aa7b4;border-radius:6px;background:#fff;font-weight:700}
.rem .rr button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.rem .rr .sp{flex:1}
.rem textarea{width:100%;min-height:62px;padding:7px;border:1px solid #9aa7b4;border-radius:7px;resize:vertical}
.canned{display:flex;flex-direction:column;gap:5px;margin:6px 0 10px}
.canned button{text-align:left;border:1px solid #c9d3dc;background:#f3f7fb;border-radius:7px;padding:8px 9px;font-size:14px;white-space:pre-line}
.small{font-size:12.5px;color:#5a6673}
/* report preview */
#reportWrap{overflow:hidden;margin:0 auto}
#reportZoom{transform-origin:0 0;width:816px}
#reportZoom .pg{margin:0 0 14px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.hide{display:none!important}

/* ---------- printed report ---------- */
.pg{width:816px;height:1056px;position:relative;background:#fff;color:#000;font-family:"Times New Roman",Times,serif;font-size:12.5px;overflow:hidden;line-height:1.2}
.pg .fv,.pg .cl{font-family:Arial,Helvetica,sans-serif;font-style:italic;font-size:13px}
.pg .b{font-weight:bold}
.pg .bl{display:inline-block;border-bottom:1px solid #000;text-align:center;vertical-align:baseline;line-height:13px;min-height:14px;font-family:Arial,Helvetica,sans-serif;font-style:italic;font-size:13px}
.pg .r{display:flex;align-items:flex-end;height:16px;white-space:nowrap}
.pg .r .n{width:26px;text-align:right;padding-right:5px;flex:0 0 auto}
.pg .r .l{flex:0 0 auto}
.pg .r .d{flex:1 1 auto;overflow:hidden;padding:0 4px 0 6px;letter-spacing:1.5px;font-size:11px}
.pg .r .d::after{content:". . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."}
.pg .r .v{flex:0 0 52px;margin-right:2px}
.pg .r.h{font-weight:bold;font-size:13.5px}
.pg .r.h .n{font-weight:normal}
.pg .lc{position:absolute;left:14px;width:356px}
.pg .cl{position:absolute;white-space:pre}
.pg .ftr{position:absolute;left:18px;right:30px;font-size:12.5px}
.pg .pa{position:absolute;left:30px;top:22px;width:630px;font-size:12.5px}
.pg .ch{position:absolute;font-size:13px}
.p1 .sb{position:absolute;right:6px;writing-mode:vertical-rl;font-family:"Times New Roman",Times,serif;white-space:nowrap}
.p1 .bx{border:1px solid #000;padding:6px 10px}
.p1 p{margin:0}
.p1 ol{margin:0;padding:0 0 0 28px}
.p1 ol li{margin:0 0 7px}
@media print{
  @page{size:letter;margin:0}
  html,body{background:#fff}
  .noprint,.top,.tabs,.pager,.mod,main>*:not(#view){display:none!important}
  main{padding:0;margin:0;max-width:none}
  #view{display:block!important}
  #view>*:not(#reportWrap){display:none!important}
  #reportWrap{width:auto!important;height:auto!important;overflow:visible!important}
  #reportZoom{transform:none!important}
  #reportZoom .pg{margin:0;box-shadow:none;break-after:page;page-break-after:always;height:11in}
  #reportZoom .pg:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <button class="tb" onclick="showJobs()">☰ Reports</button>
    <div class="addr" id="topAddr">Maplewood TISH</div>
    <button class="tb" onclick="go('view')">View</button>
    <button class="tb" onclick="doPrint()">Print</button>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<main id="main">
  <section id="jobs" class="hide"></section>
  <section id="settings" class="hide"></section>
  <section id="edit" class="hide"></section>
  <section id="view" class="hide">
    <div class="noprint" id="viewMsgs"></div>
    <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="pbtn" onclick="doPrint()">Print / Save PDF</button>
      <button class="pbtn" onclick="saveJobFile()">Save report file (.json)</button>
      <button class="pbtn sec" onclick="go(lastTab||'addr')">Back to editing</button>
    </div>
    <div id="reportWrap"><div id="reportZoom"></div></div>
  </section>
</main>
<div class="pager noprint" id="pager">
  <button class="pbtn sec" onclick="pageStep(-1)">◀ Page Up</button>
  <button class="pbtn sec" onclick="pageStep(1)">Page Dn ▶</button>
</div>
<div class="mod" id="mod" onclick="if(event.target===this)closeMod()"><div class="box" id="modBox"></div></div>

function rate(id,v){
  const r=rec(id);let cur=(r.v||'').split(',').filter(Boolean);
  if(MULTI.has(v)){ cur=cur.filter(x=>MULTI.has(x)); if(cur.includes(v))cur=cur.filter(x=>x!==v); else cur.push(v); }
  else cur=(cur.length===1&&cur[0]===v)?[]:[v];
  const added=MULTI.has(v)&&cur.includes(v);
  r.v=ordVal(cur.join(',')); save(); refreshItem(id);
  if(added&&SET.autoRemark&&id!=='39loc'&&id!=='39hw'){const rr=peek(remKey(id));if(!(rr.rem||[]).some(m=>m.r===v))openRem(remKey(id),v)}

const LH=16, CW=318, CIND=13;
const cv=document.createElement('canvas').getContext('2d');
function wrapText(prefix,text,width){
  cv.font='italic 13px Arial, Helvetica, sans-serif';
  const out=[];const paras=String(text).split('\n');
  paras.forEach((p,pi)=>{
    const words=(pi===0&&prefix?prefix+' ':'').concat(p).split(/ +/).filter(w=>w!=='');
    let line='',ind=out.length===0?0:CIND;
    if(!words.length){out.push({t:'',i:ind});return}
    words.forEach(w=>{const test=line?line+' '+w:w;
      if(cv.measureText(test).width>(width-ind)&&line){out.push({t:line,i:ind});line=w;ind=CIND}else line=test});
    if(line)out.push({t:line,i:ind});
  });
  return out;
}

function flowPage(pgEl,spec,carry){
  const left=spec.left||382;
  const anchorY=a=>{const e=pgEl.querySelector(`[data-a="${a}"]`);if(!e)return spec.top;let y=0,n=e;while(n&&n!==pgEl){y+=n.offsetTop;n=n.offsetParent}return y};
  const blocks=[];if(carry.length)blocks.push({y:spec.top,lines:carry});
  spec.blocks.forEach(([a,ids])=>{const lines=linesFor(ids,spec.u);if(lines.length)blocks.push({y:Math.max(spec.top,anchorY(a)),lines})});
  let y=spec.top,html='',rest=[];
  for(let bi=0;bi<blocks.length;bi++){const b=blocks[bi];
    if(rest.length){rest.push(...b.lines);continue}
    y=Math.max(y,b.y);
    for(let li=0;li<b.lines.length;li++){
      if(y+LH>spec.bottom){rest=b.lines.slice(li);break}
      const L=b.lines[li];html+=`<div class="cl" style="left:${left+L.i}px;top:${y}px">${esc(L.t)}</div>`;y+=LH;
    }
  }
  if(rest.length&&rest[0].i)rest=rest.slice(); // keep hanging indents
  pgEl.insertAdjacentHTML('beforeend',html);
  return rest;
}

}
